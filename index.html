<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Adan Hospital · OPD टोकन</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Devanagari:wght@400;600;800&display=swap">
<style>
:root{--bg:#F3F8F7;--card:#FFFFFF;--ink:#12303A;--mute:#5B7480;--teal:#0E7C7B;--tealink:#FFFFFF;--amber:#E8A33D;--line:#D5E3E1;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1C21;--card:#14282F;--ink:#E6F1F0;--mute:#8FA9B0;--teal:#3CB5B1;--tealink:#062321;--amber:#F0B65A;--line:#24404A}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Noto Sans Devanagari",system-ui,sans-serif;line-height:1.5;max-width:520px;margin:0 auto;padding:16px}
.brand{display:flex;align-items:center;gap:12px;margin:4px 0 14px}
.brand svg{width:48px;height:48px;flex:none}
.brand h1{font-size:21px;margin:0;font-weight:800;line-height:1.2}
.brand span{font-size:13px;color:var(--mute)}
.tabs{display:flex;gap:8px;margin-bottom:14px}
.tabs button{flex:1;padding:10px;border-radius:10px;border:1.5px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600}
.tabs button.on{background:var(--teal);color:var(--tealink);border-color:var(--teal)}
.now{background:var(--teal);color:var(--tealink);border-radius:18px;padding:18px;text-align:center;margin-bottom:14px}
.now small{display:block;opacity:.85}
.now b{font-size:64px;line-height:1.1;font-weight:800}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
label{display:block;font-size:14px;color:var(--mute);margin:8px 0 4px}
input,select{width:100%;padding:12px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);color:var(--ink);font:inherit}
.btn{width:100%;margin-top:12px;padding:14px;border:0;border-radius:12px;background:var(--amber);color:#2A1B00;font:inherit;font-weight:800;font-size:16px}
.btn:disabled{opacity:.45}
.btn.alt{background:var(--teal);color:var(--tealink)}
.btn.ghost{background:transparent;color:var(--mute);border:1.5px solid var(--line);font-weight:600}
.mine{border:2px solid var(--amber)}
.mine .num{font-size:44px;font-weight:800}
.row{display:flex;justify-content:space-between;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.mute{color:var(--mute);font-size:14px}
.ok{color:var(--teal);font-weight:600}
.no{color:var(--amber);font-weight:600}
.days{display:flex;flex-wrap:wrap;gap:6px}
.days label{display:flex;align-items:center;gap:4px;margin:0;padding:6px 10px;border:1.5px solid var(--line);border-radius:999px;color:var(--ink)}
.days input{width:auto;padding:0}
.two{display:flex;gap:8px}
.hide{display:none}
</style>
</head>
<body>
<div class="brand">
  <svg viewBox="0 0 48 48" role="img" aria-label="Adan Hospital logo"><path d="M6 42V22C6 12 14 5 24 5s18 7 18 17v20z" fill="#0E7C7B"/><path d="M21 15h6v7h7v6h-7v7h-6v-7h-7v-6h7z" fill="#FFFFFF"/><rect x="6" y="40" width="36" height="3" fill="#E8A33D"/></svg>
  <div><h1>Adan Hospital</h1><span>OPD टोकन और कतार</span></div>
</div>
<div class="tabs">
  <button id="tp" class="on">मरीज़</button>
  <button id="tr">रिसेप्शन</button>
</div>
<label for="doc">डॉक्टर चुनें</label>
<select id="doc"></select>
<div id="sched" class="mute" style="margin:6px 0 12px"></div>
<div class="now"><small>अभी चल रहा टोकन</small><b id="serving">—</b></div>

<section id="patient">
  <div id="mine" class="card mine hide"></div>
  <div id="form" class="card">
    <label for="nm">मरीज़ का नाम</label>
    <input id="nm" autocomplete="name" maxlength="50">
    <label for="ph">फ़ोन नंबर</label>
    <input id="ph" type="tel" inputmode="numeric" maxlength="10">
    <button class="btn" id="get">टोकन लें</button>
  </div>
</section>

<section id="desk" class="hide">
  <div id="login" class="card">
    <b>रिसेप्शन लॉगिन</b>
    <label for="em">ईमेल</label>
    <input id="em" type="email" autocomplete="username">
    <label for="pw">पासवर्ड</label>
    <input id="pw" type="password" autocomplete="current-password">
    <button class="btn alt" id="go">लॉगिन करें</button>
    <div id="lerr" class="no" style="margin-top:8px"></div>
  </div>
  <div id="staff" class="hide">
    <button class="btn alt" id="next">अगला मरीज़ बुलाएँ</button>
    <div class="card" style="margin-top:12px"><b>इंतज़ार में</b><div id="list"></div></div>
    <button class="btn ghost" id="reset">इस डॉक्टर की कतार खाली करें</button>

    <div class="card" style="margin-top:16px">
      <b>नया डॉक्टर जोड़ें</b>
      <label for="dn">डॉक्टर का नाम</label>
      <input id="dn" placeholder="जैसे: डॉ. अनीता तिर्की">
      <label for="dd">विभाग</label>
      <input id="dd" placeholder="जैसे: स्त्री रोग">
      <label>किन दिनों बैठते हैं</label>
      <div class="days" id="dd7"></div>
      <div class="two">
        <div style="flex:1"><label for="hf">शुरू (घंटा, 0-23)</label><input id="hf" type="number" min="0" max="23" value="10"></div>
        <div style="flex:1"><label for="ht">खत्म (घंटा, 1-24)</label><input id="ht" type="number" min="1" max="24" value="18"></div>
      </div>
      <button class="btn alt" id="addDoc">डॉक्टर जोड़ें</button>
    </div>
    <button class="btn ghost" id="out">लॉगआउट</button>
  </div>
</section>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-app.js";
import {getFirestore,doc as fdoc,collection,query,orderBy,onSnapshot,runTransaction,setDoc,updateDoc,getDocs,writeBatch} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

const app=initializeApp({
  apiKey:"AIzaSyBe9lc1cvCd8gOF-ANoZb7s7c4LXZ0wIOI",
  authDomain:"adan-hospital.firebaseapp.com",
  projectId:"adan-hospital",
  storageBucket:"adan-hospital.firebasestorage.app",
  messagingSenderId:"47022081665",
  appId:"1:47022081665:web:4ea699df85177954922f80"
});
const db=getFirestore(app),auth=getAuth(app);
const $=id=>document.getElementById(id);
const DN=["रवि","सोम","मंगल","बुध","गुरु","शुक्र","शनि"];
const DEF=[{n:"डॉ. सैमुअल लकड़ा",d:"हड्डी रोग और जोड़ प्रत्यारोपण सर्जन",days:[0,2],f:10,t:18},
           {n:"डॉ. गुलशन कुमार",d:"जनरल फ़िज़िशियन",days:[0,1,2,3,4,5,6],f:10,t:18}];
let docs=[],cur=0,Q={n:0,s:0},pts=[],user=null,unQ=null,unP=null;
const esc=s=>{const e=document.createElement("div");e.textContent=s;return e.innerHTML};
const hr=h=>(h<12?"सुबह ":h<16?"दोपहर ":"शाम ")+(h>12?h-12:h)+" बजे";
const daysTxt=a=>a.length==7?"हफ़्ते के सातों दिन":a.map(i=>DN[i]).join(", ");
const today=()=>new Date().toISOString().slice(0,10);
function mineGet(){try{const m=JSON.parse(localStorage.getItem("adanMine")||"{}")[cur];return m&&m.day==today()?m.t:null}catch(e){return null}}
function mineSet(t){try{const o=JSON.parse(localStorage.getItem("adanMine")||"{}");o[cur]={t:t,day:today()};localStorage.setItem("adanMine",JSON.stringify(o))}catch(e){}}

function fillDocs(){
  $("doc").innerHTML="";
  docs.forEach((x,i)=>{const o=document.createElement("option");o.value=i;o.textContent=x.n+" · "+x.d;$("doc").appendChild(o)});
  if(cur>=docs.length)cur=0;$("doc").value=cur;
}
function draw(){
  const D=docs[cur];
  if(!D){$("sched").textContent="डॉक्टरों की सूची लोड हो रही है…";$("get").disabled=true;return}
  const here=D.days.includes(new Date().getDay());
  $("sched").innerHTML=daysTxt(D.days)+" · "+hr(D.f)+" से "+hr(D.t)+" तक<br>"+(here?'<span class="ok">आज उपलब्ध</span>':'<span class="no">आज नहीं बैठते</span>');
  $("serving").textContent=Q.s||"—";
  let mt=mineGet();if(mt&&mt>Q.n)mt=null;
  const m=$("mine");
  if(mt){
    const ahead=Math.max(0,mt-Q.s-1),done=Q.s>=mt;
    m.classList.remove("hide");$("form").classList.add("hide");
    m.innerHTML='<div class="mute">आपका टोकन</div><div class="num">'+mt+'</div>'+(done?'<div>आपकी बारी आ गई है, कृपया डॉक्टर के पास जाएँ।</div>':'<div>आपसे पहले '+ahead+' मरीज़ हैं।</div><div class="mute">लगभग '+(ahead*5)+' मिनट का इंतज़ार</div>');
  }else{m.classList.add("hide");$("form").classList.remove("hide")}
  $("get").disabled=!here;$("get").textContent=here?"टोकन लें":"आज इनके टोकन बंद हैं";
  const w=pts.filter(x=>x.t>Q.s);
  $("list").innerHTML=w.length?w.map(x=>'<div class="row"><span>टोकन '+x.t+' · '+esc(x.name)+'</span><span class="mute">'+esc(x.ph||"")+'</span></div>').join(""):'<div class="mute">अभी कोई इंतज़ार में नहीं है।</div>';
}
function watchQueue(){
  if(unQ)unQ();if(unP){unP();unP=null}
  Q={n:0,s:0};pts=[];draw();
  unQ=onSnapshot(fdoc(db,"q","d"+cur),s=>{Q=s.exists()?s.data():{n:0,s:0};draw()});
  if(user)unP=onSnapshot(query(collection(db,"q","d"+cur,"pt"),orderBy("t")),s=>{pts=s.docs.map(d=>d.data());draw()});
}
onSnapshot(fdoc(db,"config","doctors"),s=>{
  docs=s.exists()?s.data().list:[];fillDocs();watchQueue();
  if(!s.exists()&&user)setDoc(fdoc(db,"config","doctors"),{list:DEF});
});
$("doc").onchange=()=>{cur=+$("doc").value;watchQueue()};

$("get").onclick=async()=>{
  const n=$("nm").value.trim(),p=$("ph").value.trim();
  if(!n){$("nm").focus();return}
  if(!/^\d{10}$/.test(p)){$("ph").focus();alert("10 अंकों का फ़ोन नंबर लिखें");return}
  $("get").disabled=true;
  try{
    const ref=fdoc(db,"q","d"+cur);
    const t=await runTransaction(db,async tx=>{
      const r=await tx.get(ref),n0=r.exists()?r.data().n:0,s0=r.exists()?r.data().s:0,nt=n0+1;
      tx.set(ref,{n:nt,s:s0});
      tx.set(fdoc(db,"q","d"+cur,"pt",String(nt)),{t:nt,name:n,ph:p});
      return nt;
    });
    mineSet(t);$("nm").value="";$("ph").value="";
  }catch(e){alert("टोकन नहीं बन पाया। इंटरनेट देखकर दोबारा कोशिश करें।")}
  draw();
};

onAuthStateChanged(auth,u=>{
  user=u;$("login").classList.toggle("hide",!!u);$("staff").classList.toggle("hide",!u);
  if(u&&!docs.length)setDoc(fdoc(db,"config","doctors"),{list:DEF}).catch(()=>{});
  watchQueue();
});
$("go").onclick=async()=>{
  $("lerr").textContent="";
  try{await signInWithEmailAndPassword(auth,$("em").value.trim(),$("pw").value);$("pw").value=""}
  catch(e){$("lerr").textContent="ईमेल या पासवर्ड गलत है।"}
};
$("out").onclick=()=>signOut(auth);
$("next").onclick=()=>{if(Q.s<Q.n)updateDoc(fdoc(db,"q","d"+cur),{s:Q.s+1}).catch(()=>alert("नहीं हो पाया"))};
$("reset").onclick=async()=>{
  if(!confirm("इस डॉक्टर की पूरी कतार खाली करें?"))return;
  try{
    const snap=await getDocs(collection(db,"q","d"+cur,"pt")),b=writeBatch(db);
    snap.forEach(d=>b.delete(d.ref));b.set(fdoc(db,"q","d"+cur),{n:0,s:0});await b.commit();
  }catch(e){alert("नहीं हो पाया")}
};
DN.forEach((x,i)=>{const l=document.createElement("label");l.innerHTML='<input type="checkbox" value="'+i+'">'+x;$("dd7").appendChild(l)});
$("addDoc").onclick=async()=>{
  const n=$("dn").value.trim(),dp=$("dd").value.trim(),f=+$("hf").value,t=+$("ht").value;
  const ds=[...$("dd7").querySelectorAll("input:checked")].map(c=>+c.value);
  if(!n){$("dn").focus();return}
  if(!ds.length){alert("कम से कम एक दिन चुनें");return}
  if(!(t>f)){alert("खत्म होने का समय शुरू से बाद का हो");return}
  try{
    await setDoc(fdoc(db,"config","doctors"),{list:[...docs,{n:n,d:dp||"सामान्य",days:ds,f:f,t:t}]});
    $("dn").value="";$("dd").value="";$("dd7").querySelectorAll("input").forEach(c=>c.checked=false);
    alert("डॉक्टर जोड़ दिए गए");
  }catch(e){alert("नहीं हो पाया")}
};
const tab=p=>{$("patient").classList.toggle("hide",!p);$("desk").classList.toggle("hide",p);$("tp").classList.toggle("on",p);$("tr").classList.toggle("on",!p)};
$("tp").onclick=()=>tab(true);$("tr").onclick=()=>tab(false);
</script>
</body>
</html>
